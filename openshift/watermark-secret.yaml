# Watermark key shared between the vLLM server and the detector.
# Both must use the same key or detection will fail.
#
# Create with:
#   oc apply -f watermark-secret.yaml
#
# Or generate directly without checking into source control:
#   oc create secret generic watermark-key --from-literal=key=98765
---
apiVersion: v1
kind: Secret
metadata:
  name: watermark-key
  labels:
    app: vllm-watermark
type: Opaque
stringData:
  key: "98765"
